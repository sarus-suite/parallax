name: Ubuntu amd64 and arm64 pipeline

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  actions: write
  attestations: write
  packages: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_REF: ${{ github.ref }}
      GITHUB_EVENT_PATH: ${{ github.event_path }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            lsb-release \
            wget \
            tar \
            gzip \
            git \
            btrfs-progs \
            libbtrfs-dev \
            lvm2 \
            libdevmapper-dev \
            squashfs-tools \
            fuse-overlayfs \
            squashfuse \
            inotify-tools \
            build-essential

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.24.0'
          check-latest: true

      - name: Install go deps
        run: go mod download

      - name: Detect Ubuntu version
        id: ubuntu_version
        run: echo "ver=$(lsb_release -rs)" >> "$GITHUB_OUTPUT"

      - name: Build Linux binary ${{ matrix.arch }} (with Ubuntu version)
        env:
          CGO_ENABLED: "1"
          CC: gcc
          GOARCH: ${{ matrix.arch }}
          GOOS: linux
          GOFLAGS: "-buildvcs=false"
          GO_LDFLAGS: "-linkmode external"
          CGO_LDFLAGS: "-g -O2"
        run: |
          mkdir -p dist
          OUT="parallax-${{ github.ref_name }}-ubuntu-${{ steps.ubuntu_version.outputs.ver }}-${{ matrix.arch }}"
          echo "Building $OUT"
          go build -v -x \
              -ldflags "-X 'github.com/sarus-suite/parallax/version.Version=${{ github.ref_name }}'" \
              -o dist/$OUT \
              .

      - name: Inspect binary
        run: |
          OUT="parallax-${{ github.ref_name }}-ubuntu-${{ steps.ubuntu_version.outputs.ver }}-${{ matrix.arch }}"
          file dist/$OUT
          readelf -l dist/$OUT | grep interpreter || true
          ldd dist/$OUT || echo "static :/"

      - name: Upload release asset
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-binary-${{ matrix.arch }}
          path: dist/parallax-${{ github.ref_name }}-ubuntu-${{ steps.ubuntu_version.outputs.ver }}-${{ matrix.arch }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download built assets
        uses: actions/download-artifact@v4
        with:
          pattern: ubuntu-binary-*
          merge-multiple: true
          path: dist

      - name: Create or Update GitHub Release and Upload Assets
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          artifacts: dist/*
          allowUpdates: true
          replacesArtifacts: true
          draft: false
          prerelease: false
